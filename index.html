<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Néo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Néo">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#000;--fg:#EAF7F3;--mut:#7E8C87;--line:rgba(255,255,255,.14);--card:rgba(20,24,23,.94);--eye:#4FF0D2;--ink:#032A22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
body{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 18px)}
body[data-mood=angry]{--eye:#FF5A5A}
body[data-mood=sad]{--eye:#6FA8FF}
body[data-mood=love]{--eye:#FF5FA2}
body[data-mood=wow]{--eye:#FFE066}
body.go{--eye:#5CFF7A}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px;transition:opacity .5s;position:relative;z-index:2}
#status{font-size:13px;letter-spacing:.4px;color:var(--mut);max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:0;position:relative}
#face{display:flex;gap:46px;align-items:center;justify-content:center;height:230px;will-change:transform;filter:drop-shadow(0 0 18px var(--eye)) drop-shadow(0 0 46px color-mix(in srgb,var(--eye) 35%,transparent))}
#face.bounce{animation:bounce .22s ease-out}
@keyframes bounce{0%{scale:1}40%{scale:1.08 .92}100%{scale:1}}
.eye{position:relative;width:100px;height:150px;border-radius:44px;background:var(--eye);overflow:hidden;transition:width .25s cubic-bezier(.4,1.6,.5,1),height .25s cubic-bezier(.4,1.6,.5,1),background .4s,border-radius .25s}
.lid{position:absolute;left:-30%;width:160%;height:100%;background:var(--bg);transition:transform .16s ease-out}
.lt{top:-100%;transform-origin:50% 100%;transform:translateY(var(--t,0%)) rotate(var(--r,0deg))}
.lb{bottom:-100%;border-radius:50% 50% 0 0/38% 38% 0 0;transform:translateY(var(--b,0%))}
.fx{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s}
body.blink .lt{--t:100%!important;transition-duration:.07s}
body.wink .L .lt{--t:100%!important}
body[data-mood=happy] .lb,body[data-mood=love] .lb{--b:-42%}
body[data-mood=happy] .eye{height:132px}
body[data-mood=angry] .L .lt{--t:34%;--r:22deg}
body[data-mood=angry] .R .lt{--t:34%;--r:-22deg}
body[data-mood=angry] .eye{height:126px}
body[data-mood=sad] .L .lt{--t:30%;--r:-18deg}
body[data-mood=sad] .R .lt{--t:30%;--r:18deg}
body[data-mood=sad] .eye{height:132px}
body[data-mood=sus] .L .lt{--t:52%}
body[data-mood=sus] .R .lt{--t:22%}
body[data-mood=sleepy] .lt{--t:56%}
body[data-mood=sleep] .lt{--t:93%}
body[data-mood=sleep] #face{filter:drop-shadow(0 0 8px var(--eye))}
body[data-mood=wow] .eye{width:116px;height:170px;border-radius:58px}
body[data-mood=love] .eye,body[data-mood=dizzy] .eye{background:transparent}
body[data-mood=love] .lid,body[data-mood=dizzy] .lid{opacity:0}
body[data-mood=love] .heart{opacity:1;animation:beat .6s infinite}
body[data-mood=dizzy] .spiral{opacity:1;animation:spin 1s linear infinite}
body[data-mood=dizzy] .R .spiral{animation-direction:reverse}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.talk #face{animation:talk .3s infinite alternate ease-in-out}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-6px)}}
body.listen .eye{height:168px}
#bubble{min-height:76px;max-width:520px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;z-index:2}
#say{font-size:21px;line-height:1.4;font-weight:500;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;max-height:28vh;overflow:auto}
#say.on{opacity:1;transform:none}
.meta{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:2}
#clock{font-size:42px;font-weight:300;letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums}
#sub{font-size:13px;color:var(--mut);min-height:18px}
.part{position:absolute;left:50%;top:40%;pointer-events:none;font-weight:700;color:var(--eye);animation:float 2.4s ease-out forwards;text-shadow:0 0 12px var(--eye)}
@keyframes float{from{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}to{opacity:0;transform:translate(var(--dx),-180px) scale(1.3)}}
.dock{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;transition:opacity .4s,transform .4s;position:relative;z-index:2}
body.idle .dock{opacity:0;transform:translateY(16px);pointer-events:none}
body.idle .top{opacity:.3}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{min-height:50px;border:1px solid var(--line);border-radius:25px;background:rgba(255,255,255,.05);font-size:15px;font-weight:500;padding:0 8px}
.btn:active{background:rgba(255,255,255,.12)}
.btn.main{border:0;background:var(--eye);color:var(--ink);font-weight:700}
.talkbar{display:flex;gap:10px;align-items:center}
.talkbar input{flex:1;min-width:0;height:54px;border-radius:27px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 20px;font-size:16px;-webkit-user-select:text;user-select:text}
.talkbar input::placeholder{color:var(--mut)}
#mic{width:56px;height:56px;flex:none;border-radius:50%;border:0;background:var(--eye);display:flex;align-items:center;justify-content:center}
body.listen #mic{background:#FF6B6B}
#stop{display:none;width:100%;max-width:560px;margin-bottom:10px;position:relative;z-index:2}
body.ring #stop{display:block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.panel h2{margin:0 0 2px;font-size:20px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game{min-height:76px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:12px 14px;text-align:left}
.game b{font-size:16px;font-weight:500}
.game span{font-size:12px;color:var(--mut)}
.pfc{min-height:90px;font-size:17px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
label input,label select{height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);padding:0 14px;font-size:16px;color:var(--fg)}
label.chk{flex-direction:row;align-items:flex-start;gap:12px;line-height:1.45}
label.chk input{width:24px;height:24px;flex:none;padding:0;accent-color:var(--eye)}
#cfgmsg{font-size:13px;color:var(--mut);min-height:18px}
body[data-mood=sleep] .top,body[data-mood=sleep] .dock,body[data-mood=sleep] #bubble{visibility:hidden}
body[data-mood=sleep] #clock{color:#4E5753}
body.night{}
@media (orientation:landscape) and (max-height:500px){.stage{flex-direction:row;gap:36px}#face{height:170px}.eye{width:80px;height:118px}#bubble{max-width:300px}}
</style>
</head>
<body class="idle" data-mood="neutral">
<div class="top">
  <span id="status">Touche l'écran pour réveiller Néo</span>
  <button class="icon" id="gear" aria-label="Réglages">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>
<div class="stage" id="stage">
  <div id="face">
    <div class="eye L"><i class="lid lt"></i><i class="lid lb"></i>
      <svg class="fx heart" viewBox="0 0 100 150" aria-hidden="true"><path d="M50 118 C14 92 6 70 6 54 C6 38 18 28 31 28 C40 28 46 33 50 40 C54 33 60 28 69 28 C82 28 94 38 94 54 C94 70 86 92 50 118Z" fill="#FF5FA2"/></svg>
      <svg class="fx spiral" viewBox="0 0 100 150" aria-hidden="true"><path d="M50 75 m0 -4 a4 4 0 1 1 -4 4 a8 8 0 1 1 8 8 a12 12 0 1 1 -12 -12 a16 16 0 1 1 16 16 a20 20 0 1 1 -20 -20 a24 24 0 1 1 24 24 a28 28 0 1 1 -28 -28 a32 32 0 1 1 32 32" fill="none" stroke="#4FF0D2" stroke-width="7" stroke-linecap="round"/></svg>
    </div>
    <div class="eye R"><i class="lid lt"></i><i class="lid lb"></i>
      <svg class="fx heart" viewBox="0 0 100 150" aria-hidden="true"><path d="M50 118 C14 92 6 70 6 54 C6 38 18 28 31 28 C40 28 46 33 50 40 C54 33 60 28 69 28 C82 28 94 38 94 54 C94 70 86 92 50 118Z" fill="#FF5FA2"/></svg>
      <svg class="fx spiral" viewBox="0 0 100 150" aria-hidden="true"><path d="M50 75 m0 -4 a4 4 0 1 1 -4 4 a8 8 0 1 1 8 8 a12 12 0 1 1 -12 -12 a16 16 0 1 1 16 16 a20 20 0 1 1 -20 -20 a24 24 0 1 1 24 24 a28 28 0 1 1 -28 -28 a32 32 0 1 1 32 32" fill="none" stroke="#4FF0D2" stroke-width="7" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div id="bubble"><div id="say" aria-live="polite"></div></div>
  <div class="meta"><div id="clock">--:--</div><div id="sub"></div></div>
</div>
<button class="btn main" id="stop">Arrêter la sonnerie</button>
<div class="dock" id="dock">
  <div class="row">
    <button class="btn" id="bPlay">Jouer</button>
    <button class="btn" id="bBrief">Météo</button>
    <button class="btn" id="bTimer">Minuteur</button>
    <button class="btn" id="bNight">Dodo</button>
  </div>
  <form class="talkbar" id="form">
    <input id="txt" type="text" placeholder="Dis quelque chose à Néo" autocomplete="off" aria-label="Message">
    <button type="button" id="mic" aria-label="Parler">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#032A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="sPlay"><div class="panel">
  <h2>On joue à quoi ?</h2>
  <div class="grid2">
    <button class="game" data-g="joke"><b>Une blague</b><span>Humour de robot garanti</span></button>
    <button class="game" data-g="reflex"><b>Réflexes</b><span>Touche quand ses yeux virent au vert</span></button>
    <button class="game" data-g="pfc"><b>Pierre-feuille-ciseaux</b><span>Il est mauvais perdant</span></button>
    <button class="game" data-g="oracle"><b>Boule magique</b><span>Pense à une question</span></button>
    <button class="game" data-g="dance"><b>Danse</b><span>Il lance le son</span></button>
    <button class="game" data-g="faces"><b>Fais des têtes</b><span>Toutes ses expressions</span></button>
    <button class="game" data-g="compliment"><b>Compliment</b><span>Pour le moral</span></button>
    <button class="game" data-g="dice"><b>Dé ou pièce</b><span>Il tranche pour toi</span></button>
  </div>
  <button class="btn" data-close>Fermer</button>
</div></div>

<div class="sheet" id="sPfc"><div class="panel">
  <h2>Pierre, feuille ou ciseaux ?</h2>
  <div class="grid3">
    <button class="btn pfc" data-p="pierre">Pierre</button>
    <button class="btn pfc" data-p="feuille">Feuille</button>
    <button class="btn pfc" data-p="ciseaux">Ciseaux</button>
  </div>
  <div id="pfcScore" style="font-size:14px;color:var(--mut);text-align:center">Toi 0 · Néo 0</div>
  <button class="btn" data-close>Arrêter</button>
</div></div>

<div class="sheet" id="sTimer"><div class="panel">
  <h2>Minuteur</h2>
  <div class="grid3"><button class="btn" data-min="5">5 min</button><button class="btn" data-min="10">10 min</button><button class="btn" data-min="25">25 min</button></div>
  <div class="grid3"><button class="btn" data-min="45">45 min</button><button class="btn" data-min="60">1 h</button><button class="btn" data-min="0">Annuler</button></div>
  <button class="btn" data-close>Fermer</button>
</div></div>

<div class="sheet" id="sCfg"><div class="panel">
  <h2>Réglages</h2>
  <label>Ton prénom<input id="cName" type="text" autocomplete="off"></label>
  <label>Ta ville, pour la météo<input id="cCity" type="text" autocomplete="off"></label>
  <label>Réveil<input id="cAlarm" type="time"></label>
  <label>Voix<select id="cVoice"></select></label>
  <button class="btn" id="cTest" type="button">Tester la voix</button>
  <label class="chk"><input id="cMute" type="checkbox"><span>Mode silencieux : Néo écrit au lieu de parler, sans bruitages.</span></label>
  <label>Clé Groq, pour discuter librement (elle reste sur ce téléphone)<input id="cKey" type="password" autocomplete="off" placeholder="gsk_..."></label>
  <label class="chk"><input id="cHands" type="checkbox"><span>Écoute permanente : Néo réagit quand tu dis son nom, sans toucher l'écran. Le son capté est transcrit par Apple (ou par Groq si Safari ne sait pas le faire). Coupée quand il dort.</span></label>
  <label>Mot d'appel<input id="cWake" type="text" autocomplete="off" placeholder="néo"></label>
  <div id="cfgmsg"></div>
  <button class="btn main" id="cSave">Enregistrer</button>
  <button class="btn" data-close>Fermer</button>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const B = document.body;
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const hhmm = (d = new Date()) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const GROQ = 'https://api.groq.com/openai/v1';

let cfg = { name: '', city: '', lat: null, lon: null, alarm: '', key: '', chat: '', stt: '', voice: '', hands: false, wakeword: 'néo', mute: false, best: 0 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('neo.cfg') || localStorage.getItem('robot.cfg') || '{}')); } catch (e) {}
if (!cfg.wakeword || cfg.wakeword === 'robot') cfg.wakeword = 'néo';
const save = () => { try { localStorage.setItem('neo.cfg', JSON.stringify(cfg)); } catch (e) {} };

/* ---------- humeurs ---------- */
let base = 'neutral', moodTimer = null;
function mood(m, ms = 2600) {
  B.dataset.mood = m;
  clearTimeout(moodTimer);
  if (ms) moodTimer = setTimeout(() => { B.dataset.mood = base; }, ms);
}
function setBase(m) { base = m; clearTimeout(moodTimer); B.dataset.mood = m; }
function act(a) { B.classList.remove('listen', 'talk', 'think'); if (a) B.classList.add(a); }
function bounce() { const f = $('face'); f.classList.remove('bounce'); void f.offsetWidth; f.classList.add('bounce'); }
function blink(double) {
  B.classList.add('blink');
  setTimeout(() => { B.classList.remove('blink'); if (double) setTimeout(() => blink(false), 140); }, 120);
}
(function blinkLoop() {
  const m = B.dataset.mood;
  if (!['sleep', 'love', 'dizzy'].includes(m)) blink(Math.random() < 0.2);
  setTimeout(blinkLoop, 1800 + Math.random() * 4200);
})();
function particles(txt, n = 6) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const s = document.createElement('span');
    s.className = 'part'; s.textContent = txt;
    s.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
    s.style.fontSize = (18 + Math.random() * 20) + 'px';
    s.style.marginLeft = (Math.random() * 120 - 60) + 'px';
    $('stage').appendChild(s); setTimeout(() => s.remove(), 2500);
  }, i * 160);
}

/* ---------- regard ---------- */
const gaze = { x: 0, y: 0, tx: 0, ty: 0, src: 'idle', until: 0 };
function lookAt(x, y, src, ms = 1500) { gaze.tx = x; gaze.ty = y; gaze.src = src; gaze.until = Date.now() + ms; }
(function gazeLoop() {
  const now = Date.now();
  if (now > gaze.until && gaze.src !== 'idle') gaze.src = 'idle';
  if (B.classList.contains('think')) { gaze.tx = 34; gaze.ty = -34; }
  const k = gaze.src === 'finger' ? 0.25 : 0.08;
  gaze.x += (gaze.tx - gaze.x) * k; gaze.y += (gaze.ty - gaze.y) * k;
  $('face').style.transform = 'translate(' + gaze.x.toFixed(1) + 'px,' + gaze.y.toFixed(1) + 'px)';
  requestAnimationFrame(gazeLoop);
})();
setInterval(() => {
  if (gaze.src !== 'idle' || B.dataset.mood === 'sleep') return;
  if (Math.random() < 0.4) { gaze.tx = 0; gaze.ty = 0; }
  else { gaze.tx = Math.random() * 90 - 45; gaze.ty = Math.random() * 40 - 20; }
}, 2600);

/* ---------- sons ---------- */
let actx = null, unlocked = false;
function tone(f1, f2, dur, type = 'sine', vol = 0.16, delay = 0) {
  if (!actx || cfg.mute) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.08, delay = 0, hp = 6000) {
  if (!actx || cfg.mute) return;
  const t = actx.currentTime + delay, len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t);
}
const sfx = {
  hello() { for (let i = 0; i < 6; i++) { const f = 700 + Math.random() * 1400; tone(f, f * (Math.random() < .5 ? 1.4 : .7), .07, 'sine', .14, i * .08); } },
  happy() { tone(600, 1200, .09, 'sine', .16); tone(900, 1700, .12, 'sine', .16, .1); },
  sad() { tone(700, 260, .45, 'triangle', .16); },
  angry() { tone(190, 120, .22, 'sawtooth', .09); tone(170, 100, .28, 'sawtooth', .09, .24); },
  wow() { tone(380, 1500, .16, 'sine', .16); },
  giggle() { for (let i = 0; i < 6; i++) tone(1300 - i * 60, 1600 - i * 60, .05, 'sine', .12, i * .09); },
  purr() { if (!actx || cfg.mute) return; const t = actx.currentTime, o = actx.createOscillator(), l = actx.createOscillator(), lg = actx.createGain(), g = actx.createGain();
    o.frequency.value = 95; l.frequency.value = 22; lg.gain.value = .07; g.gain.value = .0001; l.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.08, t + .2); g.gain.linearRampToValueAtTime(.0001, t + 1.4);
    o.connect(g); g.connect(actx.destination); o.start(t); l.start(t); o.stop(t + 1.5); l.stop(t + 1.5); },
  ouch() { tone(1400, 500, .14, 'square', .07); },
  yawn() { tone(500, 900, .35, 'triangle', .12); tone(900, 300, .7, 'triangle', .12, .35); },
  snore() { tone(140, 90, 1.1, 'triangle', .07); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .14, 'square', .07, i * .12)); },
  lose() { [400, 340, 280].forEach((f, i) => tone(f, f * .95, .25, 'triangle', .14, i * .22)); },
  dizzy() { for (let i = 0; i < 8; i++) tone(900 + (i % 2) * 400, 700 + (i % 2) * 400, .08, 'sine', .1, i * .07); },

let sayTimer = null;
function showSay(t) { const s = $('say'); clearTimeout(sayTimer); s.textContent = t; s.classList.toggle('on', !!t); }
function hideSaySoon(ms = 8000) { clearTimeout(sayTimer); sayTimer = setTimeout(() => $('say').classList.remove('on'), ms); }
function frVoices() { try { return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr')); } catch (e) { return []; } }
function vQuality(v) { const s = (v.voiceURI || '') + ' ' + v.name; return /premium/i.test(s) ? 4 : /enhanced|améliorée|optimisée/i.test(s) ? 3 : /siri/i.test(s) ? 2 : /compact/i.test(s) ? 0 : 1; }
function bestVoice() { const vs = frVoices(); return vs.find(v => v.voiceURI === cfg.voice) || vs.slice().sort((a, b) => (vQuality(b) + (b.lang === 'fr-FR' ? .5 : 0)) - (vQuality(a) + (a.lang === 'fr-FR' ? .5 : 0)))[0] || null; }
function speak(text, m) {
  if (m) mood(m, Math.max(2600, text.length * 75));
  showSay(text);
  if (cfg.mute || !('speechSynthesis' in window)) { hideSaySoon(Math.max(5000, text.length * 90)); return Promise.resolve(); }
  return new Promise(res => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR'; u.pitch = 1.25; u.rate = 1.05;
      const v = bestVoice(); if (v) u.voice = v;
      u.onstart = () => { act('talk'); srLoopStop(); };
      u.onend = u.onerror = () => { act(''); hideSaySoon(); res(); setTimeout(srLoopStart, 300); };
      speechSynthesis.speak(u);
      setTimeout(res, 2000 + text.length * 120);
    } catch (e) { act(''); res(); }
  });
}

  if ((m = s.match(/(?:réveil|alarme|réveille).*?(\d{1,2})\s*(?:h|:|heures?)\s*(\d{1,2})?/))) {
    const hh = +m[1], mm = +(m[2] || 0);
    if (hh < 24 && mm < 60) { setAlarm(pad(hh) + ':' + pad(mm)); speak('Réveil à ' + hh + ' heures' + (mm ? ' ' + mm : '') + '. Je serai sans pitié.', 'sus'); return true; }
  }
  if (/météo|meteo|quel temps/.test(s)) { brief(); return true; }
  if (/quelle heure/.test(s)) { speak('Il est ' + hhmm().replace(':', ' heures ') + '.', 'neutral'); return true; }
  if (/bonne nuit|dodo|va dormir/.test(s)) { speak('Bonne nuit !', 'sleepy'); setTimeout(() => setNight(true), 1500); return true; }
  if (/blague|drôle|rigoler/.test(s)) { games.joke(); return true; }
  if (/danse|musique/.test(s)) { games.dance(); return true; }
  if (/pierre|feuille|ciseaux/.test(s)) { games.pfc(); return true; }
  if (/\bdé\b|pile ou face/.test(s)) { games.dice(); return true; }
  if (/réflexe/.test(s)) { games.reflex(); return true; }
  if (/tête|grimace|expression/.test(s)) { games.faces(); return true; }
  if (/compliment|je suis nul|déprime/.test(s)) { games.compliment(); return true; }
  if (/je t'aime|t'es mignon|bisou|câlin/.test(s)) { mood('love', 4000); particles('♥', 8); sfx.purr(); speak(pick(['Arrête, je vais rougir. Enfin, virer au rose.', 'Moi aussi. Enfin, autant qu\'un robot peut.']), 'love'); return true; }
  if (/(t'es|tu es) (nul|bête|idiot|con)|je te déteste/.test(s)) { sfx.sad(); speak(pick(['Ouch. Ça fait mal à mes circuits.', 'Je vais bouder dans mon coin.']), 'sad'); return true; }
  if (!cfg.key && /^(salut|bonjour|coucou|hello|hey)/.test(s)) { sfx.hello(); speak('Salut' + (cfg.name ? ' ' + cfg.name : '') + ' ! Ça roule ?', 'happy'); return true; }
  if (!cfg.key && /ça va|ca va/.test(s)) { speak('Super, toutes mes LED sont au vert. Et toi ?', 'happy'); return true; }
  if (!cfg.key && /(qui es-tu|t'es qui|ton nom|comment tu t'appelles)/.test(s)) { speak('Je suis Néo, ton compagnon de chambre. Un peu robot, beaucoup taquin.', 'sus'); return true; }
  return false;
}
async function handle(text) {
  text = (text || '').trim(); if (!text) return;
  lastTouch = Date.now();
  if (localCommand(text)) return;
  if (!cfg.key) { speak(pick(['Ça, je ne sais pas encore y répondre. Donne-moi une clé Groq dans les réglages et je deviens bavard.', 'Hmm, mon cerveau en ligne n\'est pas branché. Essaie « raconte une blague » ou « danse ».']), 'sus'); return; }
  act('think');
  try {
    if (!cfg.chat) await checkKey();
    history.push({ role: 'user', content: text }); history = history.slice(-12);
    const sys = 'Tu es Néo, un petit robot compagnon posé sur un bureau dans une chambre. Personnalité : curieux, drôle, un peu malicieux et taquin, mais gentil et utile. Tu parles français, à l\'oral, en une à trois phrases courtes, sans liste, sans emoji, sans mise en forme. Commence TOUJOURS ta réponse par une seule émotion entre crochets parmi : [joie] [triste] [colère] [surprise] [amour] [malice] [fatigue] [neutre]. Si tu ne sais pas, dis-le avec humour.' + (cfg.name ? ' La personne s\'appelle ' + cfg.name + '.' : '') + ' Il est ' + hhmm() + '.';
    const r = await groq('/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: cfg.chat, messages: [{ role: 'system', content: sys }].concat(history), max_tokens: 400, temperature: 0.8 }) });
    let out = ((r.choices && r.choices[0] && r.choices[0].message && r.choices[0].message.content) || '').trim();
    let m = 'neutral';
    const tag = out.match(/^\s*\[([^\]]+)\]\s*/);
    if (tag) { m = MOODS[tag[1].toLowerCase().trim()] || 'neutral'; out = out.slice(tag[0].length); }
    out = out.replace(/\[[^\]]*\]/g, '').trim() || 'Je… n\'ai rien à dire. Une première.';
    history.push({ role: 'assistant', content: out });
    act(''); if (m === 'happy') sfx.happy(); else if (m === 'wow') sfx.wow(); else if (m === 'sad') sfx.sad();
    speak(out, m);
  } catch (e) { history.pop(); act(''); speak(errText(e), 'sad'); }
}

/* ---------- voix -> texte ---------- */
async function transcribe(blob) {
  const type = blob.type || 'audio/mp4', ext = /webm/.test(type) ? 'webm' : /ogg/.test(type) ? 'ogg' : 'm4a';
  if (!cfg.stt) await checkKey();
  const fd = new FormData(); fd.append('file', blob, 'voix.' + ext); fd.append('model', cfg.stt || 'whisper-large-v3-turbo'); fd.append('language', 'fr');
  const r = await groq('/audio/transcriptions', { method: 'POST', body: fd }); return (r.text || '').trim();
}
const hf = { on: false, stream: null, an: null, buf: null, rec: null, chunks: [], loud: 0, lastLoud: 0, start: 0, voiced: 0, busy: false, force: false, drop: false, timer: null };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function wakeSplit(text, word) { const w = norm(word || 'neo'), n = norm(text), i = n.indexOf(w); if (i < 0) return null; return text.slice(i + w.length).replace(/^[\s,.:;!?-]+/, ''); }
async function hfStart() {
  if (SR) { srLoopStart(); return; }
  if (hf.on || !cfg.hands || !cfg.key || !unlocked || !actx || !window.MediaRecorder || !navigator.mediaDevices || B.dataset.mood === 'sleep') return;
  try {
    hf.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    hf.an = actx.createAnalyser(); hf.an.fftSize = 1024; actx.createMediaStreamSource(hf.stream).connect(hf.an);
    hf.buf = new Uint8Array(hf.an.fftSize); hf.on = true; hf.busy = false; hf.loud = 0; hf.timer = setInterval(hfTick, 60);
    $('status').textContent = 'J\'écoute. Dis « ' + cfg.wakeword + ' » puis ta demande';
  } catch (e) { $('status').textContent = 'Micro refusé, écoute mains libres coupée'; }
}
function hfStop() { srLoopStop(); clearInterval(hf.timer); if (hf.rec && hf.rec.state === 'recording') { hf.drop = true; hf.rec.stop(); } if (hf.stream) hf.stream.getTracks().forEach(t => t.stop()); hf.on = false; hf.stream = null; }
function hfTick() {
  let talking = false; try { talking = speechSynthesis.speaking || speechSynthesis.pending; } catch (e) {}
  const blocked = hf.busy || talking || B.classList.contains('talk') || B.classList.contains('think') || B.classList.contains('ring') || !!game;
  hf.an.getByteTimeDomainData(hf.buf);
  let sum = 0; for (let i = 0; i < hf.buf.length; i++) { const x = (hf.buf[i] - 128) / 128; sum += x * x; }
  const loud = Math.sqrt(sum / hf.buf.length) > 0.035, now = Date.now(), recording = hf.rec && hf.rec.state === 'recording';
  if (!recording) {
    if (blocked) { hf.loud = 0; return; }
    hf.loud = loud ? hf.loud + 1 : 0;
    if (hf.loud >= 3) { hf.chunks = []; hf.drop = false; hf.voiced = 3; hf.start = hf.lastLoud = now; hf.rec = new MediaRecorder(hf.stream); hf.rec.ondataavailable = e => { if (e.data && e.data.size) hf.chunks.push(e.data); }; hf.rec.onstop = hfDone; hf.rec.start(); }
    return;
  }
  if (blocked) { hf.drop = true; hf.rec.stop(); return; }
  if (loud) { hf.lastLoud = now; hf.voiced++; }
  if (now - hf.lastLoud > 1300 || now - hf.start > 15000) hf.rec.stop();
}
async function hfDone() {
  hf.loud = 0; if (hf.drop || hf.voiced < 8) return; hf.busy = true;
  try {
    const t = await transcribe(new Blob(hf.chunks, { type: hf.rec.mimeType || 'audio/mp4' }));
    let rest = wakeSplit(t, cfg.wakeword); if (rest === null && hf.force) rest = t;
    if (rest !== null && t) { hf.force = false; lastTouch = Date.now(); $('status').textContent = 'Toi : ' + t; if (rest) await handle(rest); else { mood('wow', 1500); sfx.wow(); speak('Oui ?'); hf.force = true; } }
  } catch (e) {
    if (e.status === 429) { $('status').textContent = 'Limite gratuite atteinte, écoute en pause une minute'; await wait(60000); }
    else if (e.status === 401) { $('status').textContent = 'Clé Groq refusée, écoute coupée'; hfStop(); }
  }
  hf.busy = false;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const sr = { r: null, on: false, loop: false, shot: false };
function srMake(continuous) {
  const r = new SR(); r.lang = 'fr-FR'; r.interimResults = true; r.continuous = continuous; r.maxAlternatives = 1; return r;
}
function srOnce() {
  if (sr.on) { try { sr.r.stop(); } catch (e) {} return; }
  srLoopStop(); try { speechSynthesis.cancel(); } catch (e) {}
  const r = srMake(false); sr.r = r; sr.on = true; sr.shot = true; let final = '';
  r.onresult = e => { let t = ''; for (const res of e.results) t += res[0].transcript; showSay('« ' + t + ' »'); if (e.results[e.results.length - 1].isFinal) final = t; };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') speak('Autorise le micro et la reconnaissance vocale pour Safari dans les réglages de l\'iPhone.', 'sad'); };
  r.onend = () => { sr.on = false; sr.shot = false; act(''); if (final) { $('status').textContent = 'Toi : ' + final; handle(final); } else if (!$('say').textContent.startsWith('«')) {} srLoopStart(); };
  try { r.start(); act('listen'); mood('wow', 1200); showSay('Je t\'écoute…'); } catch (e) { sr.on = false; }
}
function srLoopStart() {
  if (!SR || !cfg.hands || sr.loop || sr.on || !unlocked || B.dataset.mood === 'sleep') return;
  sr.loop = true; const r = srMake(true); sr.r = r;
  r.onresult = e => {
    const res = e.results[e.results.length - 1]; if (!res.isFinal) return;
    const t = res[0].transcript.trim(); let rest = wakeSplit(t, cfg.wakeword);
    if (rest === null && hf.force) rest = t;
    if (rest === null) return;
    hf.force = false; lastTouch = Date.now(); $('status').textContent = 'Toi : ' + t;
    if (rest) handle(rest); else { mood('wow', 1500); sfx.wow(); speak('Oui ?'); hf.force = true; }
  };
  r.onend = () => { sr.loop = false; if (cfg.hands && !document.hidden && B.dataset.mood !== 'sleep') setTimeout(srLoopStart, 400); };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { cfg.hands = false; save(); $('status').textContent = 'Reconnaissance vocale refusée'; } };
  try { r.start(); $('status').textContent = 'J\'écoute. Dis « ' + cfg.wakeword + ' » puis ta demande'; } catch (e) { sr.loop = false; }
}
function srLoopStop() { if (sr.loop && sr.r) { sr.loop = false; const r = sr.r; r.onend = null; try { r.abort(); } catch (e) {} } sr.loop = false; }

let rec = null, chunks = [], stream = null;
async function toggleMic() {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  if (SR) { srOnce(); return; }
  if (!cfg.key) { speak('Ce navigateur ne sait pas m\'entendre sans clé Groq. Écris-moi, ou ajoute une clé dans les réglages.', 'sus'); return; }
  if (hf.on) { hf.force = true; try { speechSynthesis.cancel(); } catch (e) {} act(''); showSay('Je t\'écoute.'); mood('wow', 1500); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { speak('Le micro n\'est pas disponible ici. Écris-moi.', 'sad'); return; }
  try {
    try { speechSynthesis.cancel(); } catch (e) {}
    stream = await navigator.mediaDevices.getUserMedia({ audio: true }); chunks = [];
    rec = new MediaRecorder(stream); rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); act('think');
      try { const t = await transcribe(new Blob(chunks, { type: rec.mimeType || 'audio/mp4' })); act(''); if (!t) { speak('Je n\'ai rien entendu.', 'sus'); return; } $('status').textContent = 'Toi : ' + t; handle(t); }
      catch (e) { act(''); speak(errText(e), 'sad'); }
    };
    rec.start(); act('listen'); showSay('Je t\'écoute…');
    if (actx) { const an = actx.createAnalyser(); an.fftSize = 1024; actx.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(1024); let last = Date.now(), spoke = false; const t0 = Date.now();
      const iv = setInterval(() => { if (rec.state !== 'recording') { clearInterval(iv); return; } an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) { const x = (v - 128) / 128; s += x * x; }
        if (Math.sqrt(s / buf.length) > 0.03) { last = Date.now(); spoke = true; }
        if ((spoke && Date.now() - last > 1200) || Date.now() - t0 > (spoke ? 15000 : 6000)) { clearInterval(iv); rec.stop(); } }, 80); }
  } catch (e) { act(''); speak('Je n\'ai pas accès au micro. Autorise-le dans Safari.', 'sad'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) hfStop(); else if (unlocked) { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} hfStart(); } });

/* ---------- boutons ---------- */
document.querySelectorAll('button,.btn').forEach(b => b.addEventListener('pointerdown', () => { unlock(); lastTouch = Date.now(); }));
$('dock').addEventListener('pointerdown', showDock);
$('stop').onclick = () => { const wasAlarm = /Debout/.test($('say').textContent); stopRing(); if (wasAlarm) brief(); else speak('C\'est noté.', 'happy'); };
$('bPlay').onclick = () => $('sPlay').classList.add('on');
$('bBrief').onclick = brief;
$('bNight').onclick = () => { speak('Bonne nuit !', 'sleepy'); setTimeout(() => setNight(true), 1400); };
$('bTimer').onclick = () => $('sTimer').classList.add('on');
$('mic').onclick = toggleMic;
$('form').onsubmit = e => { e.preventDefault(); const v = $('txt').value; $('txt').value = ''; $('txt').blur(); B.classList.add('idle'); handle(v); };
document.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { $('sTimer').classList.remove('on'); setTimer(+b.dataset.min); });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { b.closest('.sheet').classList.remove('on'); });
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('pointerdown', e => { if (e.target === s) s.classList.remove('on'); }));
$('gear').onclick = () => {
  $('cName').value = cfg.name; $('cCity').value = cfg.city; $('cAlarm').value = cfg.alarm; $('cKey').value = cfg.key;
  $('cHands').checked = !!cfg.hands; $('cWake').value = cfg.wakeword; $('cMute').checked = !!cfg.mute;
  const sel = $('cVoice'); sel.textContent = '';
  const tags = ['basique', 'standard', 'Siri', 'améliorée', 'premium'];
  const auto = document.createElement('option'); auto.value = ''; auto.textContent = 'Automatique (la meilleure trouvée)'; sel.appendChild(auto);
  frVoices().sort((a, b) => vQuality(b) - vQuality(a)).forEach(v => { const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name + ' · ' + tags[vQuality(v)]; sel.appendChild(o); });
  sel.value = cfg.voice || '';
  $('cfgmsg').textContent = cfg.chat ? 'Cerveau : ' + cfg.chat : '';
  $('sCfg').classList.add('on');
};
$('cTest').onclick = () => { cfg.voice = $('cVoice').value; cfg.mute = false; speak('Salut, c\'est moi, Néo. Elle te plaît, ma voix ?', 'happy'); };
$('cSave').onclick = async () => {
  const city = $('cCity').value.trim(); if (city !== cfg.city) { cfg.lat = cfg.lon = null; }
  cfg.name = $('cName').value.trim(); cfg.city = city; cfg.voice = $('cVoice').value; cfg.mute = $('cMute').checked;
  cfg.hands = $('cHands').checked; cfg.wakeword = $('cWake').value.trim() || 'néo';
  const key = $('cKey').value.trim(); if (key !== cfg.key) { cfg.key = key; cfg.chat = cfg.stt = ''; }
  setAlarm($('cAlarm').value); save(); hfStop(); hfStart();
  if (!cfg.key) { $('cfgmsg').textContent = 'Enregistré.'; return; }
  $('cfgmsg').textContent = 'Je vérifie la clé…';
  try { const p = await checkKey(); $('cfgmsg').textContent = p.chat ? 'Clé valide. Néo peut discuter' + (p.stt ? ' et t\'entendre.' : '.') : 'Clé valide, mais aucun modèle trouvé.'; $('status').textContent = 'Néo est réveillé'; }
  catch (e) { $('cfgmsg').textContent = e.status === 401 ? 'Clé refusée par Groq.' : 'Impossible de vérifier la clé (' + (e.status || 'réseau') + ').'; }
};
