<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Compagnon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compagnon">
<meta name="theme-color" content="#0E0F0F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#000;--fg:#EAF7F3;--mut:#7E8C87;--line:rgba(255,255,255,.14);--card:rgba(22,26,25,.92);--eye:#4FF0D2;--glow:rgba(79,240,210,.55);--ink:#032A22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 20px);transition:background 1s}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px;transition:opacity .5s}
#status{font-size:13px;letter-spacing:.4px;color:var(--mut);max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
#face{display:flex;gap:52px;align-items:center;justify-content:center;height:220px;transition:transform 1.1s cubic-bezier(.4,1.4,.5,1)}
.eye{width:96px;height:150px;border-radius:40px;background:var(--eye);box-shadow:0 0 24px var(--glow),0 0 70px rgba(79,240,210,.22);border:0 solid transparent;transition:height .35s cubic-bezier(.4,1.6,.5,1),width .35s,border-radius .35s,background .35s,border-color .35s,transform .35s,opacity .8s;animation:blink 6s infinite}
.eye:nth-child(2){animation-delay:.04s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}}
body.listen .eye{height:172px;width:104px;animation:none}
body.think .eye{height:118px;animation:none}
body.think #face{transform:translate(26px,-30px)!important}
body.talk .eye{animation:talk .42s infinite alternate ease-in-out}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.8)}}
body.happy .eye{width:104px;height:104px;border-radius:50%;background:transparent;border:18px solid var(--eye);border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent;transform:translateY(34px);animation:none;box-shadow:none;filter:drop-shadow(0 0 14px var(--glow))}
#bubble{min-height:84px;max-width:540px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center}
#say{font-size:21px;line-height:1.4;font-weight:500;color:var(--fg);opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;max-height:30vh;overflow:auto}
#say.on{opacity:1;transform:none}
.meta{display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .5s}
#clock{font-size:46px;font-weight:300;letter-spacing:2px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
#sub{font-size:13px;color:var(--mut);min-height:18px;letter-spacing:.3px}
.dock{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;transition:opacity .45s,transform .45s}
body.idle .dock{opacity:0;transform:translateY(16px);pointer-events:none}
body.idle .top{opacity:.35}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{height:50px;border:1px solid var(--line);border-radius:25px;background:rgba(255,255,255,.04);font-size:15px;font-weight:500;letter-spacing:.2px}
.btn:active{background:rgba(255,255,255,.1)}
.btn.main{border:0;background:var(--eye);color:var(--ink);font-weight:700;box-shadow:0 0 22px var(--glow)}
.talkbar{display:flex;gap:10px;align-items:center}
.talkbar input{flex:1;min-width:0;height:54px;border-radius:27px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 20px;font-size:16px;-webkit-user-select:text;user-select:text}
.talkbar input::placeholder{color:var(--mut)}
#mic{width:58px;height:58px;flex:none;border-radius:50%;border:0;background:var(--eye);display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px var(--glow);transition:background .3s,box-shadow .3s}
body.listen #mic{background:#FF6B6B;box-shadow:0 0 26px rgba(255,107,107,.6)}
#stop{display:none;width:100%;max-width:560px;margin-bottom:10px}
body.ring #stop{display:block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:500}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
label input,label select{height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);padding:0 14px;font-size:16px;color:var(--fg)}
label.chk{flex-direction:row;align-items:flex-start;gap:12px;line-height:1.45}
label.chk input{width:24px;height:24px;flex:none;padding:0;accent-color:var(--eye)}
#cfgmsg{font-size:13px;color:var(--mut);min-height:18px}
body.night{--bg:#000}
body.night .eye{height:6px;border-radius:3px;opacity:.28;animation:none;box-shadow:none}
body.night #clock{color:#4E5753}
body.night #sub{color:#3E4643}
body.night .top,body.night #bubble,body.night .dock{visibility:hidden}
@media (orientation:landscape) and (max-height:500px){.stage{flex-direction:row;gap:40px}#face{height:160px}.eye{height:120px;width:80px}#bubble{max-width:320px}}
</style>
</head>
<body class="idle">
<div class="top">
  <span id="status">Touche l'écran pour m'activer</span>
  <button class="icon" id="gear" aria-label="Réglages">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>
<div class="stage">
  <div id="face"><div class="eye"></div><div class="eye"></div></div>
  <div id="bubble"><div id="say" aria-live="polite"></div></div>
  <div class="meta"><div id="clock">--:--</div><div id="sub"></div></div>
</div>
<button class="btn main" id="stop">Arrêter la sonnerie</button>
<div class="dock">
  <div class="row">
    <button class="btn" id="bBrief">Brief</button>
    <button class="btn" id="bTimer">Minuteur</button>
    <button class="btn" id="bNight">Nuit</button>
  </div>
  <form class="talkbar" id="form">
    <input id="txt" type="text" placeholder="Écris-moi quelque chose" autocomplete="off" aria-label="Message">
    <button type="button" id="mic" aria-label="Parler">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#032A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="sTimer"><div class="panel">
  <h2>Minuteur</h2>
  <div class="row"><button class="btn" data-min="5">5 min</button><button class="btn" data-min="10">10 min</button><button class="btn" data-min="25">25 min</button></div>
  <div class="row"><button class="btn" data-min="45">45 min</button><button class="btn" data-min="60">1 h</button><button class="btn" data-min="0">Annuler</button></div>
  <button class="btn" data-close>Fermer</button>
</div></div>

<div class="sheet" id="sCfg"><div class="panel">
  <h2>Réglages</h2>
  <label>Ton prénom<input id="cName" type="text" autocomplete="off"></label>
  <label>Ta ville, pour la météo<input id="cCity" type="text" autocomplete="off"></label>
  <label>Réveil<input id="cAlarm" type="time"></label>
  <label>Voix<select id="cVoice"></select></label>
  <button class="btn" id="cTest" type="button">Tester la voix</button>
  <label>Clé Groq (elle reste sur ce téléphone)<input id="cKey" type="password" autocomplete="off" placeholder="gsk_..."></label>
  <label class="chk"><input id="cHands" type="checkbox"><span>Écoute mains libres : le micro reste ouvert et ce qu'il capte est envoyé à Groq pour être transcrit. Coupée en mode nuit.</span></label>
  <label>Mot d'appel<input id="cWake" type="text" autocomplete="off" placeholder="robot"></label>
  <div id="cfgmsg"></div>
  <button class="btn main" id="cSave">Enregistrer</button>
  <button class="btn" data-close>Fermer</button>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const GROQ = 'https://api.groq.com/openai/v1';
const WMO = {0:'ciel dégagé',1:'plutôt dégagé',2:'partiellement nuageux',3:'couvert',45:'brouillard',48:'brouillard givrant',51:'bruine légère',53:'bruine',55:'bruine forte',61:'pluie faible',63:'pluie',65:'forte pluie',66:'pluie verglaçante',67:'pluie verglaçante',71:'neige faible',73:'neige',75:'forte neige',77:'grains de neige',80:'averses',81:'averses',82:'fortes averses',85:'averses de neige',86:'averses de neige',95:'orage',96:'orage avec grêle',99:'orage avec grêle'};

let cfg = {name:'', city:'', lat:null, lon:null, alarm:'', key:'', chat:'', stt:'', voice:'', hands:false, wakeword:'robot'};
try { Object.assign(cfg, JSON.parse(localStorage.getItem('robot.cfg') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('robot.cfg', JSON.stringify(cfg)); } catch (e) {} };

let actx = null, unlocked = false, ringTimer = null, timerEnd = 0, alarmFiredOn = '', history = [];
const pad = n => String(n).padStart(2, '0');
const hhmm = (d = new Date()) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const mode = m => { document.body.classList.remove('listen', 'talk', 'think', 'happy'); if (m) document.body.classList.add(m); };

function unlock() {
  if (unlocked) return;
  unlocked = true;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) {}
  $('status').textContent = cfg.key ? 'Prêt' : 'Prêt, sans IA pour le moment';
  wake();
  hfStart();
}
async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) hfStop(); else if (unlocked) { wake(); hfStart(); } });

function beep(n = 3) {
  if (!actx) return;
  for (let i = 0; i < n; i++) {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.45;
    o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.start(t); o.stop(t + 0.32);
  }
}

let sayTimer = null, idleTimer = null;
function showSay(t) { const s = $('say'); clearTimeout(sayTimer); s.textContent = t; s.classList.toggle('on', !!t); }
function hideSaySoon(ms = 9000) { clearTimeout(sayTimer); sayTimer = setTimeout(() => $('say').classList.remove('on'), ms); }
function poke() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!document.querySelector('.sheet.on') && document.activeElement !== $('txt')) document.body.classList.add('idle'); else poke(); }, 9000); }
function frVoices() { try { return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr')); } catch (e) { return []; } }
function vQuality(v) { const s = (v.voiceURI || '') + ' ' + v.name; return /premium/i.test(s) ? 4 : /enhanced|améliorée|optimisée/i.test(s) ? 3 : /siri/i.test(s) ? 2 : /compact/i.test(s) ? 0 : 1; }
function bestVoice() { const vs = frVoices(); return vs.find(v => v.voiceURI === cfg.voice) || vs.slice().sort((a, b) => (vQuality(b) + (b.lang === 'fr-FR' ? 0.5 : 0)) - (vQuality(a) + (a.lang === 'fr-FR' ? 0.5 : 0)))[0] || null; }

function speak(text) {
  showSay(text);
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    const v = bestVoice();
    if (v) u.voice = v;
    u.onstart = () => mode('talk');
    u.onend = () => { mode('happy'); setTimeout(() => { if (document.body.classList.contains('happy')) mode(''); }, 1300); hideSaySoon(); };
    u.onerror = () => { mode(''); hideSaySoon(); };
    speechSynthesis.speak(u);
  } catch (e) { mode(''); }
}

function setNight(on) {
  document.body.classList.toggle('night', on);
  if (on) { hfStop(); try { speechSynthesis.cancel(); } catch (e) {} $('sub').textContent = cfg.alarm ? 'Réveil à ' + cfg.alarm : ''; }
  else { subLine(); hfStart(); }
}
function subLine() {
  if (document.body.classList.contains('night')) return;
  const parts = [];
  if (timerEnd) { const s = Math.max(0, Math.round((timerEnd - Date.now()) / 1000)); parts.push('Minuteur ' + pad(Math.floor(s / 60)) + ':' + pad(s % 60)); }
  if (cfg.alarm) parts.push('Réveil ' + cfg.alarm);
  $('sub').textContent = parts.join(' · ');
}

function startRing(text) {
  setNight(false);
  document.body.classList.add('ring');
  beep(4);
  clearInterval(ringTimer);
  ringTimer = setInterval(() => beep(4), 2500);
  showSay(text);
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; document.body.classList.remove('ring'); }

function setTimer(min) {
  if (!min) { timerEnd = 0; speak('Minuteur annulé.'); }
  else { timerEnd = Date.now() + min * 60000; speak('Minuteur lancé pour ' + min + ' minute' + (min > 1 ? 's' : '') + '.'); }
  subLine();
}
function setAlarm(t) { cfg.alarm = t; alarmFiredOn = ''; save(); subLine(); }

async function weather() {
  if (!cfg.city) return 'Indique ta ville dans les réglages pour la météo.';
  try {
    if (cfg.lat == null) {
      const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=' + encodeURIComponent(cfg.city))).json();
      if (!g.results || !g.results.length) return 'Je ne trouve pas la ville ' + cfg.city + '.';
      cfg.lat = g.results[0].latitude; cfg.lon = g.results[0].longitude; save();
    }
    const w = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1')).json();
    const c = w.current, d = w.daily;
    return 'À ' + cfg.city + ', ' + Math.round(c.temperature_2m) + ' degrés, ' + (WMO[c.weather_code] || 'temps variable') +
      '. Aujourd\'hui entre ' + Math.round(d.temperature_2m_min[0]) + ' et ' + Math.round(d.temperature_2m_max[0]) + ' degrés, ' +
      d.precipitation_probability_max[0] + ' pour cent de risque de pluie.';
  } catch (e) { return 'Je n\'arrive pas à récupérer la météo.'; }
}
async function brief() {
  mode('think');
  const h = new Date().getHours();
  const hello = (h < 18 ? 'Bonjour' : 'Bonsoir') + (cfg.name ? ' ' + cfg.name : '') + '. Il est ' + hhmm().replace(':', ' heures ') + '. ';
  speak(hello + await weather());
}

async function groq(path, opts) {
  const r = await fetch(GROQ + path, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + cfg.key }, (opts && opts.headers) || {}) }));
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
function pickModels(ids) {
  const stt = ids.filter(i => /whisper/i.test(i)).sort((a, b) => /turbo/i.test(b) - /turbo/i.test(a))[0] || '';
  const chatIds = ids.filter(i => !/whisper|tts|guard|orpheus|playai|compound|embed|allam/i.test(i));
  const prefs = [/gpt-oss-120b/i, /llama-3\.3-70b/i, /70b/i, /qwen/i, /llama/i];
  let chat = '';
  for (const p of prefs) { chat = chatIds.find(i => p.test(i)); if (chat) break; }
  return { chat: chat || chatIds[0] || '', stt };
}
async function checkKey() {
  const m = await groq('/models');
  const picked = pickModels((m.data || []).map(x => x.id));
  cfg.chat = picked.chat; cfg.stt = picked.stt; save();
  return picked;
}
function errText(e) {
  if (e.status === 401) return 'Ta clé Groq est refusée. Vérifie-la dans les réglages.';
  if (e.status === 429) return 'J\'ai atteint la limite gratuite pour le moment. Réessaie dans une minute.';
  return 'Je n\'arrive pas à joindre l\'IA. Vérifie la connexion.';
}

function localCommand(t) {
  const s = t.toLowerCase();
  let m;
  if (/(stop|arrête|annule).*(minuteur)/.test(s)) { setTimer(0); return true; }
  if ((m = s.match(/minuteur.*?(\d+)\s*(h|heure|min|minute)?/))) { setTimer(parseInt(m[1], 10) * (m[2] && m[2][0] === 'h' ? 60 : 1)); return true; }
  if (/(supprime|annule|enlève).*(réveil|reveil|alarme)/.test(s)) { setAlarm(''); speak('Réveil supprimé.'); return true; }
  if ((m = s.match(/(?:réveil|reveil|alarme|réveille).*?(\d{1,2})\s*(?:h|:|heures?)\s*(\d{1,2})?/))) {
    const hh = +m[1], mm = +(m[2] || 0);
    if (hh < 24 && mm < 60) { setAlarm(pad(hh) + ':' + pad(mm)); speak('Réveil réglé à ' + hh + ' heures' + (mm ? ' ' + mm : '') + '.'); return true; }
  }
  if (/météo|meteo|quel temps/.test(s)) { mode('think'); weather().then(speak); return true; }
  if (/quelle heure/.test(s)) { speak('Il est ' + hhmm().replace(':', ' heures ') + '.'); return true; }
  if (/bonne nuit|mode nuit|dors/.test(s)) { speak('Bonne nuit.'); setTimeout(() => setNight(true), 1800); return true; }
  if (/\bbrief\b/.test(s) || /^(bonjour|salut)[\s!.]*$/.test(s)) { brief(); return true; }
  return false;
}

async function handle(text) {
  text = (text || '').trim();
  if (!text) return;
  if (localCommand(text)) return;
  if (!cfg.key) { speak('Pour discuter, ajoute ta clé Groq dans les réglages. Je sais déjà faire le minuteur, le réveil, la météo et le mode nuit.'); return; }
  mode('think');
  try {
    if (!cfg.chat) await checkKey();
    history.push({ role: 'user', content: text });
    history = history.slice(-10);
    const sys = 'Tu es un petit robot compagnon posé dans une chambre. Tu réponds en français, à l\'oral, en une à trois phrases courtes, sans liste, sans emoji, sans mise en forme. Si tu ne sais pas, dis-le.' +
      (cfg.name ? ' La personne s\'appelle ' + cfg.name + '.' : '') + ' Il est ' + hhmm() + '.';
    const r = await groq('/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: cfg.chat, messages: [{ role: 'system', content: sys }].concat(history), max_tokens: 220, temperature: 0.6 }) });
    const out = ((r.choices && r.choices[0] && r.choices[0].message && r.choices[0].message.content) || '').trim() || 'Je n\'ai pas de réponse.';
    history.push({ role: 'assistant', content: out });
    speak(out);
  } catch (e) { history.pop(); speak(errText(e)); }
}

async function transcribe(blob) {
  const type = blob.type || 'audio/mp4';
  const ext = /webm/.test(type) ? 'webm' : /ogg/.test(type) ? 'ogg' : 'm4a';
  if (!cfg.stt) await checkKey();
  const fd = new FormData();
  fd.append('file', blob, 'voix.' + ext);
  fd.append('model', cfg.stt || 'whisper-large-v3-turbo');
  fd.append('language', 'fr');
  const r = await groq('/audio/transcriptions', { method: 'POST', body: fd });
  return (r.text || '').trim();
}

const hf = { on: false, stream: null, an: null, buf: null, rec: null, chunks: [], loudFrames: 0, lastLoud: 0, start: 0, voiced: 0, busy: false, force: false, drop: false, timer: null };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function wakeSplit(text, word) {
  const w = norm(word || 'robot'), n = norm(text), i = n.indexOf(w);
  if (i < 0) return null;
  return text.slice(i + w.length).replace(/^[\s,.:;!?-]+/, '');
}
async function hfStart() {
  if (hf.on || !cfg.hands || !cfg.key || !unlocked || !actx || !window.MediaRecorder || !navigator.mediaDevices) return;
  if (document.body.classList.contains('night')) return;
  try {
    hf.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    hf.an = actx.createAnalyser(); hf.an.fftSize = 1024;
    actx.createMediaStreamSource(hf.stream).connect(hf.an);
    hf.buf = new Uint8Array(hf.an.fftSize);
    hf.on = true; hf.busy = false; hf.loudFrames = 0;
    hf.timer = setInterval(hfTick, 60);
    $('status').textContent = 'J\'écoute. Dis « ' + (cfg.wakeword || 'robot') + ' » puis ta demande';
  } catch (e) { $('status').textContent = 'Micro refusé, écoute mains libres coupée'; }
}
function hfStop() {
  clearInterval(hf.timer);
  if (hf.rec && hf.rec.state === 'recording') { hf.drop = true; hf.rec.stop(); }
  if (hf.stream) hf.stream.getTracks().forEach(t => t.stop());
  hf.on = false; hf.stream = null;
}
function hfTick() {
  const b = document.body.classList;
  let talking = false; try { talking = speechSynthesis.speaking || speechSynthesis.pending; } catch (e) {}
  const blocked = hf.busy || talking || b.contains('talk') || b.contains('think') || b.contains('ring');
  hf.an.getByteTimeDomainData(hf.buf);
  let sum = 0; for (let i = 0; i < hf.buf.length; i++) { const x = (hf.buf[i] - 128) / 128; sum += x * x; }
  const loud = Math.sqrt(sum / hf.buf.length) > 0.035, now = Date.now();
  const recording = hf.rec && hf.rec.state === 'recording';
  if (!recording) {
    if (blocked) { hf.loudFrames = 0; return; }
    hf.loudFrames = loud ? hf.loudFrames + 1 : 0;
    if (hf.loudFrames >= 3) {
      hf.chunks = []; hf.drop = false; hf.voiced = 3; hf.start = hf.lastLoud = now;
      hf.rec = new MediaRecorder(hf.stream);
      hf.rec.ondataavailable = e => { if (e.data && e.data.size) hf.chunks.push(e.data); };
      hf.rec.onstop = hfDone;
      hf.rec.start();
    }
    return;
  }
  if (blocked) { hf.drop = true; hf.rec.stop(); return; }
  if (loud) { hf.lastLoud = now; hf.voiced++; }
  if (now - hf.lastLoud > 1300 || now - hf.start > 15000) hf.rec.stop();
}
async function hfDone() {
  hf.loudFrames = 0;
  if (hf.drop || hf.voiced < 8) return;
  hf.busy = true;
  try {
    const t = await transcribe(new Blob(hf.chunks, { type: hf.rec.mimeType || 'audio/mp4' }));
    let rest = wakeSplit(t, cfg.wakeword);
    if (rest === null && hf.force) rest = t;
    if (rest !== null && t) {
      hf.force = false;
      $('status').textContent = 'Toi : ' + t;
      if (rest) await handle(rest); else { speak('Oui ?'); hf.force = true; }
    }
  } catch (e) {
    if (e.status === 429) { $('status').textContent = 'Limite gratuite atteinte, écoute en pause une minute'; await new Promise(r => setTimeout(r, 60000)); }
    else if (e.status === 401) { $('status').textContent = 'Clé Groq refusée, écoute coupée'; hfStop(); }
  }
  hf.busy = false;
}

let rec = null, chunks = [], stream = null;
async function toggleMic() {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  if (hf.on) { hf.force = true; try { speechSynthesis.cancel(); } catch (e) {} mode(''); showSay('Je t\'écoute.'); return; }
  if (!cfg.key) { speak('Le micro a besoin de la clé Groq. En attendant, écris-moi.'); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { speak('Le micro n\'est pas disponible ici. Écris-moi.'); return; }
  try {
    try { speechSynthesis.cancel(); } catch (e) {}
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      mode('think');
      try {
        const t = await transcribe(new Blob(chunks, { type: rec.mimeType || 'audio/mp4' }));
        if (!t) { speak('Je n\'ai rien entendu.'); return; }
        $('status').textContent = 'Toi : ' + t;
        handle(t);
      } catch (e) { speak(errText(e)); }
    };
    rec.start();
    mode('listen');
    showSay('Je t\'écoute. Touche le micro quand tu as fini.');
  } catch (e) { mode(''); speak('Je n\'ai pas accès au micro. Autorise-le dans Safari.'); }
}

function tick() {
  const now = new Date(), t = hhmm(now), day = now.toDateString();
  $('clock').textContent = t;
  if (timerEnd && Date.now() >= timerEnd) { timerEnd = 0; startRing('Le minuteur est terminé.'); }
  if (cfg.alarm && t === cfg.alarm && alarmFiredOn !== day) { alarmFiredOn = day; startRing('C\'est l\'heure de se lever.'); }
  subLine();
}
setInterval(tick, 1000); tick();
function gaze() {
  const b = document.body.classList;
  const still = b.contains('think') || b.contains('night');
  const x = Math.random() < 0.35 ? 0 : Math.round(Math.random() * 60 - 30), y = Math.round(Math.random() * 30 - 15);
  if (!still) $('face').style.transform = 'translate(' + x + 'px,' + y + 'px)';
  setTimeout(gaze, 2500 + Math.random() * 4500);
}
gaze();

document.addEventListener('pointerdown', e => {
  unlock();
  poke();
  if (document.body.classList.contains('night') && !document.body.classList.contains('ring')) { setNight(false); e.preventDefault(); }
}, true);
$('stop').onclick = () => { const wasAlarm = /lever/.test($('say').textContent); stopRing(); if (wasAlarm) brief(); else speak('C\'est noté.'); };
$('bBrief').onclick = brief;
$('bNight').onclick = () => setTimeout(() => setNight(true), 50);
$('bTimer').onclick = () => $('sTimer').classList.add('on');
$('mic').onclick = toggleMic;
$('form').onsubmit = e => { e.preventDefault(); const v = $('txt').value; $('txt').value = ''; $('txt').blur(); handle(v); };
document.querySelectorAll('[data-min]').forEach(b => b.onclick = () => { $('sTimer').classList.remove('on'); setTimer(+b.dataset.min); });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.sheet').classList.remove('on'));
$('gear').onclick = () => {
  $('cName').value = cfg.name; $('cCity').value = cfg.city; $('cAlarm').value = cfg.alarm; $('cKey').value = cfg.key;
  $('cHands').checked = !!cfg.hands; $('cWake').value = cfg.wakeword || 'robot';
  const sel = $('cVoice'); sel.textContent = '';
  const tags = ['basique', 'standard', 'Siri', 'améliorée', 'premium'];
  const auto = document.createElement('option'); auto.value = ''; auto.textContent = 'Automatique (la meilleure trouvée)'; sel.appendChild(auto);
  frVoices().sort((a, b) => vQuality(b) - vQuality(a)).forEach(v => { const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name + ' · ' + tags[vQuality(v)] + ' · ' + v.lang; sel.appendChild(o); });
  sel.value = cfg.voice || '';
  $('cfgmsg').textContent = cfg.chat ? 'Modèle utilisé : ' + cfg.chat : '';
  $('sCfg').classList.add('on');
};
$('cTest').onclick = () => { cfg.voice = $('cVoice').value; save(); speak('Voilà ma voix. Elle te convient ?'); };
$('cSave').onclick = async () => {
  const city = $('cCity').value.trim();
  if (city !== cfg.city) { cfg.lat = cfg.lon = null; }
  cfg.name = $('cName').value.trim(); cfg.city = city;
  const key = $('cKey').value.trim();
  if (key !== cfg.key) { cfg.key = key; cfg.chat = cfg.stt = ''; }
  cfg.voice = $('cVoice').value; cfg.hands = $('cHands').checked; cfg.wakeword = ($('cWake').value.trim() || 'robot');
  setAlarm($('cAlarm').value);
  save();
  hfStop(); hfStart();
  if (!cfg.key) { $('cfgmsg').textContent = 'Enregistré, sans IA.'; $('status').textContent = 'Prêt, sans IA pour le moment'; return; }
  $('cfgmsg').textContent = 'Vérification de la clé…';
  try {
    const p = await checkKey();
    $('cfgmsg').textContent = p.chat ? 'Clé valide. Modèle : ' + p.chat + (p.stt ? ' · micro : ' + p.stt : ' · pas de modèle pour le micro') : 'Clé valide, mais aucun modèle de discussion trouvé.';
    $('status').textContent = 'Prêt';
  } catch (e) { $('cfgmsg').textContent = e.status === 401 ? 'Clé refusée par Groq.' : 'Impossible de vérifier la clé (' + (e.status || 'réseau') + ').'; }
};
</script>
